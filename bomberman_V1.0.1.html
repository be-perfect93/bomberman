<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bomber Man Bonus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#101022;overflow-x:hidden;}
body{display:flex;justify-content:center;align-items:flex-start;}
#root{display:flex;flex-direction:column;align-items:center;width:100%;max-width:580px;font-family:'Courier New',monospace;position:relative;background:#1a1a2e;border-radius:8px;padding-bottom:10px;overflow:hidden;}
#scGame{width:100%;display:flex;flex-direction:column;align-items:center;padding:5px 5px 3px;}
#recentBar{display:flex;gap:3px;align-items:center;width:100%;margin-bottom:3px;min-height:18px;flex-wrap:wrap;}
.rTag{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;white-space:nowrap;}
.rWin{background:#1a3a1a;color:#44ff88;border:1px solid #22aa44;}
.rLoss{background:#3a1a1a;color:#ff4444;border:1px solid #aa2222;}
#hud{display:flex;align-items:center;gap:6px;margin-bottom:4px;width:100%;justify-content:space-between;flex-wrap:nowrap;}
.hl{font-size:9px;color:#ff8844;white-space:nowrap;}
.hv{font-size:12px;font-weight:700;color:#ffcc00;white-space:nowrap;}
#timerBar{flex:1;min-width:30px;height:4px;background:#333;border-radius:2px;overflow:hidden;}
#timerFill{height:100%;background:linear-gradient(90deg,#ff4400,#ffaa00);border-radius:2px;transition:width .05s linear;}
#cvWrap{width:100%;position:relative;}
#cv{display:block;width:100%;height:auto;border-radius:6px;border:2px solid #ff6600;background:#0a0a1a;}
#msgBox{min-height:14px;font-size:10px;color:#ffcc00;margin-top:2px;text-align:center;letter-spacing:1px;}
#spinRow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;width:100%;flex-wrap:wrap;}
.betRow{display:flex;align-items:center;gap:3px;}
.bbl{font-size:10px;color:#ff8844;}
.bbtn{background:#2a2a3e;color:#fff;border:1px solid #ff6600;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:monospace;touch-action:manipulation;}
.bbtn:disabled{opacity:.35;cursor:not-allowed;}
.bval{font-size:12px;font-weight:700;color:#ffcc00;min-width:32px;text-align:center;}
.btnSpin{padding:9px 32px;background:linear-gradient(135deg,#ff6600,#ff4400);color:#fff;border:none;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;font-family:monospace;letter-spacing:2px;touch-action:manipulation;}
.btnSpin:active:not(:disabled){opacity:.8;}
.btnSpin:disabled{opacity:.3;cursor:not-allowed;}
#balanceRow{font-size:10px;color:#ffcc00;text-align:center;margin-top:3px;letter-spacing:1px;}
/* BONUS SCREEN */
#bonusScreen{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0a0a1a;border-radius:8px;flex-direction:column;align-items:center;justify-content:flex-start;z-index:60;padding:5px 5px 4px;}
#bHud{display:flex;gap:8px;align-items:center;margin-bottom:4px;width:100%;justify-content:space-between;}
#bTl{font-size:12px;color:#cc88ff;font-weight:700;}
#bWin{background:#1a1a2e;border:1px solid #ffcc00;border-radius:6px;padding:2px 8px;font-size:11px;color:#ffcc00;font-weight:700;}
#bMsg{font-size:9px;color:#aaaacc;min-height:13px;text-align:center;margin-bottom:3px;}
#bCvWrap{width:100%;position:relative;}
#bCv{width:100%;height:auto;border-radius:6px;border:2px solid #cc44ff;display:block;background:#102013;}
#bResult{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:3px solid #cc44ff;border-radius:14px;padding:18px 24px;text-align:center;z-index:310;min-width:200px;max-width:90%;}
#bResult .bt{font-size:16px;font-weight:700;color:#cc88ff;letter-spacing:2px;margin-bottom:6px;}
#bResult .bd{font-size:10px;color:#aaaacc;line-height:1.8;max-height:100px;overflow-y:auto;margin-bottom:8px;}
#bResult .bw{font-size:20px;font-weight:700;color:#ffcc00;margin-bottom:12px;}
#bResult .bb{padding:8px 24px;background:linear-gradient(135deg,#cc44ff,#8822cc);color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:monospace;touch-action:manipulation;}
/* DPAD */
#dpadWrap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:4px;}
.drow{display:flex;gap:2px;}
.dpb{background:#1a1a3a;border:1px solid #6644aa;border-radius:6px;color:#cc88ff;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-size:18px;}
.dpb:active{background:#443366;}
.dpb.blank{background:#0a0a1a;border-color:#0a0a1a;cursor:default;color:transparent;pointer-events:none;}
</style></head>
<body>
<div id="root">
<div id="scGame">
  <div id="recentBar"></div>
  <div id="hud">
    <div><span class="hl">BET </span><span class="hv" id="hudBet">1.00</span></div>
    <div id="timerBar"><div id="timerFill" style="width:100%"></div></div>
    <div><span class="hl">TIME </span><span class="hv" id="hudTime">5.0s</span></div>
    <div><span class="hl">WIN </span><span class="hv" id="hudWin">0.00</span></div>
  </div>
  <div id="cvWrap"><canvas id="cv"></canvas></div>
  <div id="msgBox" aria-live="polite"></div>
  <div id="spinRow">
    <div class="betRow"><span class="bbl">Bet:</span><button class="bbtn" id="btnBetM">-</button><span class="bval" id="betDisp">1.00</span><button class="bbtn" id="btnBetP">+</button></div>
    <button class="btnSpin" id="btnSpin">&#9654; RUN</button>
  </div>
  <div id="balanceRow">&#x1F4B0; Balance: <span id="balanceVal">1000.00</span></div>
</div>
<div id="bonusScreen">
  <div id="bHud"><div id="bTl">BONUS - 10.0s</div><div id="bWin">WIN: 0.00</div></div>
  <div id="bCvWrap"><canvas id="bCv"></canvas></div>
  <div id="bMsg">Move with d-pad/WASD</div>
  <div id="dpadWrap">
    <div class="drow"><div class="dpb blank"></div><button class="dpb" id="dp-up">&#9650;</button><div class="dpb blank"></div></div>
    <div class="drow"><button class="dpb" id="dp-left">&#9664;</button><div class="dpb blank"></div><button class="dpb" id="dp-right">&#9654;</button></div>
    <div class="drow"><div class="dpb blank"></div><button class="dpb" id="dp-down">&#9660;</button><div class="dpb blank"></div></div>
  </div>
  <div id="bResult">
    <div class="bt">BONUS COMPLETE!</div>
    <div class="bd" id="bResultDetail"></div>
    <div class="bw" id="bResultWin"></div>
    <button class="bb" id="btnBonusContinue">CONTINUE</button>
  </div>
</div>
</div>
<script>
const COLS=25,ROWS=21;
const BET_OPTS=[0.5,1,2,5,10,20,50,100];
const DIRS4=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
const BONUS_DUR=10000;
const SHOOT_IV=220;
const BOSS_COLORS=['#ff2244','#ff6600','#aa00ff','#00bbff'];
const MTYPES=[{id:'big',reward:1000,size:24,color:'#cc44ff',spd:0.55,label:'1000x'},{id:'mid',reward:100,size:17,color:'#ff8800',spd:1.0,label:'100x'},{id:'small',reward:10,size:12,color:'#ff4444',spd:1.7,label:'10x'}];

// --- Dynamic sizing ---
let CELL=22,CW=0,CH=0,BW=0,BH=0;
let canvas,ctx,bCv,bCtx;

function computeSizes(){
  let rootW=document.getElementById('root').clientWidth||Math.min(window.innerWidth,580);
  let pad=10;
  let cvW=rootW-pad*2;
  CELL=Math.floor(cvW/COLS);
  if(CELL<12)CELL=12;
  CW=COLS*CELL; CH=ROWS*CELL;
  BW=CW; BH=Math.round(CW*280/480);
  if(canvas){canvas.width=CW;canvas.height=CH;}
  if(bCv){bCv.width=BW;bCv.height=BH;}
  // dpad button size
  let dpSize=Math.max(36,Math.min(52,Math.floor(rootW/9)));
  document.querySelectorAll('.dpb').forEach(b=>{b.style.width=dpSize+'px';b.style.height=dpSize+'px';b.style.fontSize=Math.floor(dpSize*0.4)+'px';});
}

function shu(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function rng(a,b){return Math.random()*(b-a)+a;}
function setLogLines(el,lines,empty){el.replaceChildren();for(let t of(lines.length?lines:[empty])){let r=document.createElement('div');r.textContent=t;el.appendChild(r);}}

let balance=1000,recentRounds=[];
function updateBalanceUI(){document.getElementById('balanceVal').textContent=balance.toFixed(2);}
function addRecentRound(win){
  recentRounds.unshift({net:win});if(recentRounds.length>10)recentRounds.length=10;
  let bar=document.getElementById('recentBar');bar.innerHTML='';
  for(let rr of recentRounds){let tag=document.createElement('span');tag.className='rTag '+(rr.net>0?'rWin':'rLoss');tag.textContent=(rr.net>0?'+':'')+rr.net.toFixed(2);bar.appendChild(tag);}
}

let tanks=[{edge:'top',pos:0,dir:1,speed:0.8,dc:3},{edge:'right',pos:0,dir:1,speed:1.4,dc:3},{edge:'bottom',pos:0,dir:-1,speed:1.0,dc:3},{edge:'left',pos:0,dir:1,speed:1.7,dc:3}];
function initTanks(){tanks=[{edge:'top',pos:CELL*2,dir:1,speed:0.8,dc:3},{edge:'right',pos:CELL*2,dir:1,speed:1.4,dc:3},{edge:'bottom',pos:CELL*4,dir:-1,speed:1.0,dc:3},{edge:'left',pos:CELL*6,dir:1,speed:1.7,dc:3}];}
function eLen(e){return(e==='top'||e==='bottom')?CW-2*CELL:CH-2*CELL;}
function tankXY(t){let p=t.pos;if(t.edge==='top')return{x:CELL+p,y:CELL/2,angle:0};if(t.edge==='right')return{x:CW-CELL/2,y:CELL+p,angle:Math.PI/2};if(t.edge==='bottom')return{x:CW-CELL-p,y:CH-CELL/2,angle:Math.PI};return{x:CELL/2,y:CH-CELL-p,angle:-Math.PI/2};}
function updTanks(dt){if(gameState!=='spinning')return;for(let t of tanks){t.pos+=t.dir*t.speed*(dt/16);let len=eLen(t.edge)-CELL;if(t.pos>=len){t.pos=len;t.dir=-1;}if(t.pos<=0){t.pos=0;t.dir=1;}}}
function spinTanks(){for(let t of tanks){t.dc--;if(t.dc<=0){t.dc=3;dropDiamonds(t);}}}

let fDiamonds=[],diamonds=[],mazeBombs=[],mazeExplosions=[];
function getPathCells(){let c=[];for(let r=1;r<ROWS-1;r++)for(let cc=1;cc<COLS-1;cc++)if(maze[r][cc]===0)c.push({r,c:cc});return c;}
function dropDiamonds(tank){
  let cells=getPathCells();shu(cells);
  for(let i=0;i<Math.min(10,cells.length);i++){
    let d=cells[i];
    let sx=rng(CELL,CW-CELL);
    let sy=-CELL*1.5;
    fDiamonds.push({x:sx,y:sy,tx:d.c*CELL+CELL/2,ty:d.r*CELL+CELL/2,tr:d.r,tc:d.c,progress:0,speed:rng(0.006,0.014),delay:i*70,landed:false});
  }
  collected.push('Diamonds dropped!');showMsg('DIAMONDS!',2500);
  let bCells=getPathCells();shu(bCells);bCells=bCells.slice(10);
  for(let i=0;i<2&&i<bCells.length;i++)mazeBombs.push({r:bCells[i].r,c:bCells[i].c,fuseTimer:3000,armed:false});
}
function updFD(dt){for(let fd of fDiamonds){if(fd.landed)continue;if(fd.delay>0){fd.delay-=dt;continue;}fd.progress+=fd.speed*dt;if(fd.progress>=1){fd.progress=1;fd.landed=true;diamonds.push({r:fd.tr,c:fd.tc,active:true});}}fDiamonds=fDiamonds.filter(fd=>!fd.landed);}
function updMazeBombs(dt){
  if(gameState==='spinning'){
    for(let b of mazeBombs){b.fuseTimer-=dt;if(!b.armed&&b.fuseTimer<2600)b.armed=true;if(b.armed&&player.r===b.r&&player.c===b.c){killPlayer('Stepped on BOMB! WIN=0');explodeMazeBomb(b);b.fuseTimer=0;continue;}if(b.fuseTimer<=0)explodeMazeBomb(b);}
    mazeBombs=mazeBombs.filter(b=>b.fuseTimer>0);
  }
  for(let ex of mazeExplosions)ex.life-=dt;
  mazeExplosions=mazeExplosions.filter(ex=>ex.life>0);
}
function explodeMazeBomb(b){
  const REACH=3;let cells=[{r:b.r,c:b.c}];
  for(let arm of [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}]){for(let i=1;i<=REACH;i++){let nr=b.r+arm.dr*i,nc=b.c+arm.dc*i;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||maze[nr][nc]===1)break;cells.push({r:nr,c:nc});}}
  mazeExplosions.push({cells,life:700});
  for(let cell of cells)if(cell.r===player.r&&cell.c===player.c){killPlayer('EXPLOSION hit! WIN=0');return;}
}
function killPlayer(msg){
  if(playerDead)return;playerDead=true;totalWin=0;document.getElementById('hudWin').textContent='0.00';
  collected.push(msg);showMsg(msg,2500);
  if(gameState==='spinning'||gameState==='paused'){spinTimer=0;setTimeout(()=>{playerDead=false;endSpin();},1500);}
  else setTimeout(()=>{playerDead=false;},1500);
}

let mazeBosses=[];
function spawnMazeBosses(){
  mazeBosses=[];let cells=getPathCells();shu(cells);let ctr=findCenter();
  cells=cells.filter(c=>Math.abs(c.r-ctr.r)+Math.abs(c.c-ctr.c)>6);
  for(let i=0;i<4&&i<cells.length;i++)mazeBosses.push({r:cells[i].r,c:cells[i].c,x:cells[i].c*CELL+CELL/2,y:cells[i].r*CELL+CELL/2,dir:pick(DIRS4),moveTimer:0,moveInterval:rng(400,700),color:BOSS_COLORS[i],frame:0,frameT:0});
}
function updMazeBosses(dt){
  for(let b of mazeBosses){
    b.frameT+=dt;if(b.frameT>200){b.frameT=0;b.frame=(b.frame+1)%2;}
    if(gameState!=='spinning')continue;
    b.moveTimer+=dt;
    if(b.moveTimer>=b.moveInterval){b.moveTimer=0;let opts=DIRS4.filter(d=>isPath(b.r+d.dy,b.c+d.dx));let noRev=opts.filter(d=>!(d.dx===-b.dir.dx&&d.dy===-b.dir.dy));let ch=pick(noRev.length?noRev:opts);if(ch){b.dir=ch;b.r+=ch.dy;b.c+=ch.dx;b.x=b.c*CELL+CELL/2;b.y=b.r*CELL+CELL/2;}}
    if(!playerDead&&b.r===player.r&&b.c===player.c)killPlayer('Boss killed you! WIN=0');
  }
}

let maze=[];
function genMaze(){
  maze=[];for(let r=0;r<ROWS;r++){maze[r]=[];for(let c=0;c<COLS;c++)maze[r][c]=1;}
  function dfs(r,c){maze[r][c]=0;for(let[dr,dc]of shu([[0,-2],[0,2],[-2,0],[2,0]])){let nr=r+dr,nc=c+dc;if(nr>0&&nr<ROWS-1&&nc>0&&nc<COLS-1&&maze[nr][nc]===1){maze[r+dr/2][c+dc/2]=0;dfs(nr,nc);}}}
  dfs(1,1);
  let ch=true;while(ch){ch=false;for(let r=1;r<ROWS-1;r++)for(let c=1;c<COLS-1;c++){if(maze[r][c]!==0)continue;let pn=DIRS4.filter(d=>maze[r+d.dy]&&maze[r+d.dy][c+d.dx]===0).length;if(pn===1){let wn=[];for(let d of DIRS4){let nr=r+d.dy,nc=c+d.dx;if(nr>0&&nr<ROWS-1&&nc>0&&nc<COLS-1&&maze[nr][nc]===1&&r+d.dy*2>0&&r+d.dy*2<ROWS-1&&c+d.dx*2>0&&c+d.dx*2<COLS-1)wn.push(d);}if(wn.length){let d=wn[Math.floor(Math.random()*wn.length)];maze[r+d.dy][c+d.dx]=0;ch=true;}}}}
  for(let i=0;i<Math.floor(COLS*ROWS*0.04);i++){let r=1+Math.floor(Math.random()*(ROWS-2)),c=1+Math.floor(Math.random()*(COLS-2));if(maze[r][c]===1){let pn=DIRS4.filter(d=>maze[r+d.dy]&&maze[r+d.dy][c+d.dx]===0).length;if(pn>=2)maze[r][c]=0;}}
  for(let r=0;r<ROWS;r++){maze[r][0]=1;maze[r][COLS-1]=1;}
  for(let c=0;c<COLS;c++){maze[0][c]=1;maze[ROWS-1][c]=1;}
}
function isPath(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS&&maze[r][c]===0;}

let dots=[],items=[],holes=[];
function buildDots(){dots=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(maze[r][c]===0)dots.push({r,c,active:true});}
function placeItems(){
  items=[];holes=[];let cells=dots.map(d=>({r:d.r,c:d.c}));shu(cells);let i=0;
  const add=(type,ex)=>{let cl=cells[i++];if(cl)items.push({type,r:cl.r,c:cl.c,...ex,active:true});};
  for(let n=0;n<25;n++)add('credit',{mult:parseFloat(rng(0.1,1.0).toFixed(1))});
  for(let n=0;n<8;n++)add('time',{});for(let n=0;n<6;n++)add('shoe',{});for(let n=0;n<5;n++)add('gift',{});
  let cl=cells[i++];if(cl)holes.push({r:cl.r,c:cl.c,active:true});
  for(let n=0;n<6;n++)add('trap',{});for(let n=0;n<6;n++)add('halve',{});
}

let player={r:0,c:0,x:0,y:0,dir:{dx:1,dy:0},frame:0,frameT:0};
let playerDead=false,playerStunTimer=0,stunAnimAngle=0;
function findCenter(){let cr=Math.floor(ROWS/2),cc=Math.floor(COLS/2);for(let d=0;d<10;d++)for(let dr=-d;dr<=d;dr++)for(let dc=-d;dc<=d;dc++)if(isPath(cr+dr,cc+dc))return{r:cr+dr,c:cc+dc};return{r:1,c:1};}
function initPlayer(){let s=findCenter();player.r=s.r;player.c=s.c;player.x=s.c*CELL+CELL/2;player.y=s.r*CELL+CELL/2;player.dir={dx:1,dy:0};playerDead=false;playerStunTimer=0;}
function hasTgt(r,c){return dots.some(d=>d.active&&d.r===r&&d.c===c)||items.some(it=>it.active&&it.r===r&&it.c===c)||holes.some(h=>h.active&&h.r===r&&h.c===c)||diamonds.some(d=>d.active&&d.r===r&&d.c===c);}
function aiMove(){
  if(playerDead||playerStunTimer>0)return;
  let{r,c,dir}=player;let opts=DIRS4.filter(d=>isPath(r+d.dy,c+d.dx)&&hasTgt(r+d.dy,c+d.dx));
  if(!opts.length)opts=DIRS4.filter(d=>isPath(r+d.dy,c+d.dx));if(!opts.length)return;
  let noR=opts.filter(d=>!(d.dx===-dir.dx&&d.dy===-dir.dy));if(noR.length)opts=noR;
  let same=opts.find(d=>d.dx===dir.dx&&d.dy===dir.dy);
  let ch=(same&&Math.random()<0.6)?same:pick(opts);
  player.dir=ch;player.r+=ch.dy;player.c+=ch.dx;player.x=player.c*CELL+CELL/2;player.y=player.r*CELL+CELL/2;
}

let gameState='idle',spinTimer=0,spinMax=5000;
let betIdx=1,betAmt=1,activeBetAmt=1,totalWin=0,collected=[];
let msgTimer=0,mainAnim=null,lastMainTs=0,aiTimer=0,aiInterval=156;
function showMsg(t,d=2000){document.getElementById('msgBox').textContent=t;msgTimer=d;}
function setMsg(t){document.getElementById('msgBox').textContent=t;}
function setBetControls(dis){document.getElementById('btnBetM').disabled=dis;document.getElementById('btnBetP').disabled=dis;}

let bonusActive=false,bonusEnding=false,bonusAnim=null,lastBonusTs=0,bonusTimer=0;
let bonusWin=0,bonusLog=[],bonusReturnPos={r:0,c:0};
let bp={x:0,y:0,facing:-Math.PI/2,speed:2.5};
let bHeld={up:false,down:false,left:false,right:false};
let bBullets=[],bMonsters=[],bFlashes=[],bCoins=[];
let bShootTimer=0,bKeysInit=false;

function initBonus(){
  bp={x:BW/2,y:BH*0.75,facing:-Math.PI/2,speed:2.5};
  bBullets=[];bFlashes=[];bShootTimer=0;bHeld={up:false,down:false,left:false,right:false};
  bonusWin=0;bonusLog=[];bMonsters=[];
  [{x:80,y:BH*0.25},{x:BW-80,y:BH*0.25},{x:BW/2,y:BH*0.2}].forEach((p,i)=>{
    let mt=MTYPES[i];
    bMonsters.push({...mt,x:p.x,y:p.y,dx:(i%2===0?1:-1)*mt.spd,dy:mt.spd*0.5,active:true,hitFlash:0});
  });
  bCoins=[];for(let i=0;i<40;i++)bCoins.push({x:rng(16,BW-16),y:rng(16,BH-16),mult:parseFloat(rng(0.1,1.0).toFixed(1)),active:true});
  document.getElementById('bWin').textContent='WIN: 0.00';
  document.getElementById('bMsg').textContent='Move d-pad/WASD - Gun auto-aims!';
  document.getElementById('bResult').style.display='none';
}
function startBonus(retR,retC){
  if(bonusActive)return;
  bonusReturnPos={r:retR,c:retC};bonusActive=true;bonusEnding=false;bonusTimer=BONUS_DUR;
  initBonus();
  document.getElementById('bonusScreen').style.display='flex';
  document.getElementById('bResult').style.display='none';
  collected.push('Bonus stage!');showMsg('BONUS STAGE!');
  lastBonusTs=0;if(bonusAnim){cancelAnimationFrame(bonusAnim);bonusAnim=null;}

function bonusLoop(ts){let dt=lastBonusTs?Math.min(ts-lastBonusTs,50):16;lastBonusTs=ts;if(!bonusActive)return;if(!bonusEnding)updBonus(dt);drawBonus();bonusAnim=requestAnimationFrame(bonusLoop);}
function updBonus(dt){
  bonusTimer-=dt;let tl=Math.max(bonusTimer/1000,0);document.getElementById('bTl').textContent='BONUS - '+tl.toFixed(1)+'s';
  if(bonusTimer<=0){bonusEnding=true;endBonus();return;}
  let dx=0,dy=0;
  if(bHeld.left)dx-=bp.speed;if(bHeld.right)dx+=bp.speed;if(bHeld.up)dy-=bp.speed;if(bHeld.down)dy+=bp.speed;
  bp.x=Math.max(12,Math.min(BW-12,bp.x+dx));bp.y=Math.max(12,Math.min(BH-12,bp.y+dy));
  let nearest=null,nearD=Infinity;for(let m of bMonsters){if(!m.active)continue;let d=Math.hypot(bp.x-m.x,bp.y-m.y);if(d<nearD){nearD=d;nearest=m;}}
  if(nearest)bp.facing=Math.atan2(nearest.y-bp.y,nearest.x-bp.x);
  bShootTimer-=dt;if(bShootTimer<=0){bShootTimer=SHOOT_IV;bBullets.push({x:bp.x,y:bp.y,vx:Math.cos(bp.facing)*8,vy:Math.sin(bp.facing)*8,active:true,life:1});}
  for(let m of bMonsters){if(!m.active)continue;m.x+=m.dx;m.y+=m.dy;if(m.x<=m.size){m.x=m.size;m.dx=Math.abs(m.dx);}if(m.x>=BW-m.size){m.x=BW-m.size;m.dx=-Math.abs(m.dx);}if(m.y<=m.size){m.y=m.size;m.dy=Math.abs(m.dy);}if(m.y>=BH-m.size){m.y=BH-m.size;m.dy=-Math.abs(m.dy);}if(m.hitFlash>0)m.hitFlash-=dt;}
  for(let b of bBullets){if(!b.active)continue;b.x+=b.vx;b.y+=b.vy;b.life-=dt/800;if(b.life<=0||b.x<0||b.x>BW||b.y<0||b.y>BH){b.active=false;continue;}for(let m of bMonsters){if(!m.active)continue;if(Math.hypot(b.x-m.x,b.y-m.y)<m.size+3){b.active=false;bFlashes.push({x:m.x,y:m.y,life:1.2});if(Math.random()<0.01){m.active=false;let w=activeBetAmt*m.reward;bonusWin+=w;totalWin+=w;bonusLog.push('KILL '+m.label+' +'+w.toFixed(2));collected.push('KILL '+m.label+' +'+w.toFixed(2));document.getElementById('hudWin').textContent=totalWin.toFixed(2);document.getElementById('bWin').textContent='WIN: '+bonusWin.toFixed(2);document.getElementById('bMsg').textContent=m.label+' DOWN! +'+w.toFixed(2);}else{document.getElementById('bMsg').textContent='MISS (99% miss)';m.hitFlash=200;}break;}}}
  bBullets=bBullets.filter(b=>b.active);for(let f of bFlashes)f.life-=dt/220;bFlashes=bFlashes.filter(f=>f.life>0);
  for(let c of bCoins){if(!c.active)continue;if(Math.hypot(bp.x-c.x,bp.y-c.y)<14){c.active=false;let w=activeBetAmt*c.mult;bonusWin+=w;totalWin+=w;bonusLog.push('Coin '+c.mult+'x +'+w.toFixed(2));collected.push('Coin '+c.mult+'x +'+w.toFixed(2));document.getElementById('hudWin').textContent=totalWin.toFixed(2);document.getElementById('bWin').textContent='WIN: '+bonusWin.toFixed(2);}}
}
function endBonus(){setLogLines(document.getElementById('bResultDetail'),bonusLog,'No bonus wins.');document.getElementById('bResultWin').textContent='+'+bonusWin.toFixed(2)+' WIN';document.getElementById('bResult').style.display='block';}
function closeBonus(){

function drawBonus(){
  if(!bCtx)return;
  let sc=bCtx,sw=BW,sh=BH;
  sc.clearRect(0,0,sw,sh);
  let cs=24;for(let i=0;i<sw;i+=cs)for(let j=0;j<sh;j+=cs){sc.fillStyle=(Math.floor(i/cs)+Math.floor(j/cs))%2===0?'#2a4a2e':'#1e3622';sc.fillRect(i,j,cs,cs);}
  sc.strokeStyle='#cc44ff';sc.lineWidth=3;sc.strokeRect(1,1,sw-2,sh-2);
  let pct=Math.max(bonusTimer/BONUS_DUR,0);sc.fillStyle='rgba(0,0,0,0.5)';sc.fillRect(0,0,sw,6);sc.fillStyle=pct>0.5?'#44ff88':pct>0.25?'#ffcc00':'#ff4444';sc.fillRect(0,0,sw*pct,6);
  for(let c of bCoins){if(!c.active)continue;sc.fillStyle='#ffcc00';sc.beginPath();sc.arc(c.x,c.y,8,0,Math.PI*2);sc.fill();sc.fillStyle='#ff9900';sc.beginPath();sc.arc(c.x,c.y,7,0,Math.PI*2);sc.fill();sc.fillStyle='#aa6600';sc.font='bold 7px monospace';sc.textAlign='center';sc.textBaseline='middle';sc.fillText('$',c.x,c.y);}
  for(let m of bMonsters){if(!m.active)continue;sc.save();sc.translate(m.x,m.y);let flash=m.hitFlash>0&&Math.floor(m.hitFlash/35)%2===0;sc.fillStyle=flash?'#fff':m.color;sc.beginPath();sc.arc(0,0,m.size,0,Math.PI*2);sc.fill();if(!flash){sc.fillStyle='rgba(255,255,255,0.18)';sc.beginPath();sc.arc(-m.size*.22,-m.size*.28,m.size*.45,0,Math.PI*2);sc.fill();}sc.fillStyle='#fff';sc.beginPath();sc.arc(-m.size*.28,-m.size*.18,m.size*.26,0,Math.PI*2);sc.fill();sc.beginPath();sc.arc(m.size*.28,-m.size*.18,m.size*.26,0,Math.PI*2);sc.fill();sc.fillStyle='#111';sc.beginPath();sc.arc(-m.size*.22,-m.size*.18,m.size*.13,0,Math.PI*2);sc.fill();sc.beginPath();sc.arc(m.size*.34,-m.size*.18,m.size*.13,0,Math.PI*2);sc.fill();sc.fillStyle='#fff';sc.font='bold '+Math.max(8,Math.floor(m.size*.6))+'px monospace';sc.textAlign='center';sc.fillText(m.label,0,-m.size-7);sc.fillStyle='rgba(255,255,255,0.55)';sc.font='6px monospace';sc.fillText('1% kill',0,m.size+10);sc.restore();}
  for(let b of bBullets){if(!b.active)continue;sc.save();sc.globalAlpha=Math.max(0,b.life);sc.fillStyle='#ffff44';sc.beginPath();sc.arc(b.x,b.y,4,0,Math.PI*2);sc.fill();sc.strokeStyle='#ff8800';sc.lineWidth=1.5;sc.stroke();sc.restore();}
  for(let f of bFlashes){let r=20*Math.max(0,Math.min(f.life,1));if(r<=0)continue;sc.save();sc.globalAlpha=Math.max(0,f.life*0.7);sc.fillStyle='#ffff99';sc.beginPath();sc.arc(f.x,f.y,r,0,Math.PI*2);sc.fill();sc.restore();}
  sc.save();sc.translate(bp.x,bp.y);sc.fillStyle='rgba(0,0,0,0.28)';sc.beginPath();sc.ellipse(0,10,9,3,0,0,Math.PI*2);sc.fill();sc.fillStyle='#2244cc';sc.fillRect(-5,3,4,9);sc.fillRect(1,3,4,9);sc.fillStyle='#fff';sc.fillRect(-6,-5,12,10);sc.fillStyle='#ddd';sc.fillRect(-6,-5,3,10);sc.fillStyle='#333';sc.fillRect(-6,3,12,2);sc.fillStyle='#2244cc';sc.beginPath();sc.ellipse(0,-7,7,6,0,0,Math.PI*2);sc.fill();sc.fillStyle='#88aaff';sc.fillRect(-4,-9,8,5);sc.fillStyle='#ffcc00';sc.fillRect(-3,-8,2,2);sc.fillRect(1,-8,2,2);sc.strokeStyle='#bbb';sc.lineWidth=4;sc.lineCap='round';sc.beginPath();sc.moveTo(0,0);sc.lineTo(Math.cos(bp.facing)*17,Math.sin(bp.facing)*17);sc.stroke();sc.fillStyle='#888';sc.beginPath();sc.arc(Math.cos(bp.facing)*17,Math.sin(bp.facing)*17,3.5,0,Math.PI*2);sc.fill();sc.restore();
}

function resetMap(){genMaze();buildDots();placeItems();diamonds=[];fDiamonds=[];mazeBombs=[];mazeExplosions=[];initPlayer();spawnMazeBosses();aiInterval=156;}
function startSpin(){
  if(gameState!=='idle')return;
  activeBetAmt=betAmt;totalWin=0;collected=[];balance-=activeBetAmt;updateBalanceUI();
  document.getElementById('hudBet').textContent=activeBetAmt.toFixed(2);document.getElementById('hudWin').textContent='0.00';
  resetMap();spinTanks();gameState='spinning';spinTimer=spinMax;aiTimer=0;
  document.getElementById('hudTime').textContent='5.0s';document.getElementById('timerFill').style.width='100%';
  document.getElementById('btnSpin').disabled=true;setBetControls(true);showMsg('GO!',500);
}
function endSpin(){
  if(gameState==='idle')return;
  gameState='idle';playerDead=false;
  document.getElementById('hudTime').textContent='0.0s';document.getElementById('timerFill').style.width='0%';
  document.getElementById('btnSpin').disabled=false;setBetControls(false);
  balance+=totalWin;updateBalanceUI();
  addRecentRound(totalWin);
  showMsg('Round complete! WIN: '+totalWin.toFixed(2),2500);
}

function mainLoop(ts){
  let dt=lastMainTs?Math.min(ts-lastMainTs,50):16;lastMainTs=ts;
  updTanks(dt);updFD(dt);updMazeBombs(dt);updMazeBosses(dt);
  if(playerStunTimer>0){playerStunTimer-=dt;stunAnimAngle+=dt*0.015;}
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)setMsg('');}
  if(!bonusActive&&gameState==='spinning'){
    spinTimer-=dt;
    if(spinTimer<=0){spinTimer=0;endSpin();}
    else{
      document.getElementById('hudTime').textContent=(spinTimer/1000).toFixed(1)+'s';
      document.getElementById('timerFill').style.width=(spinTimer/spinMax*100)+'%';
      player.frameT=(player.frameT||0)+dt;if(player.frameT>120){player.frameT=0;player.frame=(player.frame+1)%4;}
      aiTimer+=dt;if(aiTimer>=aiInterval){aiTimer=0;aiMove();checkAll();}
    }
  }
  drawMain();mainAnim=requestAnimationFrame(mainLoop);
}

function checkAll(){
  for(let d of dots)if(d.active&&d.r===player.r&&d.c===player.c)d.active=false;
  for(let it of items)if(it.active&&it.r===player.r&&it.c===player.c)collectItem(it);
  for(let d of diamonds){if(!d.active)continue;if(d.r===player.r&&d.c===player.c){d.active=false;let w=activeBetAmt*10;totalWin+=w;collected.push('Diamond x10 +'+w.toFixed(2));document.getElementById('hudWin').textContent=totalWin.toFixed(2);showMsg('DIAMOND! x10');}}
  for(let h of holes){if(!h.active)continue;if(h.r===player.r&&h.c===player.c){h.active=false;if(!bonusActive){gameState='paused';startBonus(player.r,player.c);}}}
}
function collectItem(it){
  it.active=false;
  if(it.type==='credit'){let w=activeBetAmt*it.mult;totalWin+=w;collected.push(it.mult+'x +'+w.toFixed(2));document.getElementById('hudWin').textContent=totalWin.toFixed(2);showMsg('+'+w.toFixed(2));}
  else if(it.type==='time'){spinTimer=Math.min(spinTimer+2000,spinMax*2);collected.push('+2s');showMsg('+2s!');}
  else if(it.type==='shoe'){aiInterval=Math.max(40,Math.floor(aiInterval*0.667));collected.push('Speed +50%!');showMsg('Speed +50%!');}
  else if(it.type==='gift'){let m=pick([2,3,4,5]),w=activeBetAmt*m;totalWin+=w;collected.push('Gift '+m+'x');document.getElementById('hudWin').textContent=totalWin.toFixed(2);showMsg('Gift! '+m+'x');}
  else if(it.type==='trap'){playerStunTimer=500;stunAnimAngle=0;collected.push('Stunned 500ms!');showMsg('STUNNED!',1200);}
  else if(it.type==='halve'){totalWin=Math.floor(totalWin*50)/100;collected.push('WIN halved: '+totalWin.toFixed(2));document.getElementById('hudWin').textContent=totalWin.toFixed(2);showMsg('WIN HALVED!',2000);}
}

function drawMain(){
  if(!ctx)return;
  ctx.clearRect(0,0,CW,CH);
  // floor
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(maze[r][c]===0){ctx.fillStyle=(r+c)%2===0?'#3a7d44':'#2d6235';ctx.fillRect(c*CELL,r*CELL,CELL,CELL);}
  // walls
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(maze[r][c]!==1)continue;
    let x=c*CELL,y=r*CELL,sz=CELL;
    let hard=r===0||r===ROWS-1||c===0||c===COLS-1||(r%2===0&&c%2===0);
    if(hard){ctx.fillStyle='#555566';ctx.fillRect(x,y,sz,sz);ctx.fillStyle='#7777aa';ctx.fillRect(x,y,sz,4);ctx.fillRect(x,y,4,sz);ctx.fillStyle='#333344';ctx.fillRect(x,y+sz-3,sz,3);ctx.fillRect(x+sz-3,y,3,sz);ctx.fillStyle='#888899';[[5,5],[sz-5,5],[5,sz-5],[sz-5,sz-5]].forEach(([bx,by])=>{ctx.beginPath();ctx.arc(x+bx,y+by,2,0,Math.PI*2);ctx.fill();});}
    else{ctx.fillStyle='#aa5533';ctx.fillRect(x,y,sz,sz);ctx.fillStyle='#cc6644';ctx.fillRect(x,y,sz,3);ctx.fillRect(x,y,3,sz);ctx.fillStyle='#773322';ctx.fillRect(x,y+sz-3,sz,3);ctx.fillRect(x+sz-3,y,3,sz);ctx.strokeStyle='#8a3d22';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+sz/2);ctx.lineTo(x+sz,y+sz/2);ctx.stroke();let off=(r%2===0)?sz/2:0;[off,off+sz/2].forEach(ox=>{ctx.beginPath();ctx.moveTo(x+ox,y);ctx.lineTo(x+ox,y+sz/2);ctx.stroke();});let off2=(r%2===0)?0:sz/2;[off2,off2+sz/2].forEach(ox=>{ctx.beginPath();ctx.moveTo(x+ox,y+sz/2);ctx.lineTo(x+ox,y+sz);ctx.stroke();});}
  }
  // dots
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let d of dots){if(!d.active)continue;ctx.beginPath();ctx.arc(d.c*CELL+CELL/2,d.r*CELL+CELL/2,Math.max(1,CELL*0.07),0,Math.PI*2);ctx.fill();}
  // items
  for(let it of items){
    if(!it.active)continue;
    let cx=it.c*CELL+CELL/2,cy=it.r*CELL+CELL/2,r=Math.max(4,CELL*0.27);
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    if(it.type==='credit'){ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9900';ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#aa6600';ctx.font='bold '+Math.max(6,Math.floor(r*1.1))+'px monospace';ctx.fillText('$',cx,cy);}
    else if(it.type==='time'){ctx.fillStyle='#44aaff';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-r*0.6);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*0.45,cy+r*0.2);ctx.stroke();}
    else if(it.type==='shoe'){ctx.fillStyle='#44dd66';ctx.fillRect(cx-r,cy-r*0.5,r*2,r);ctx.fillRect(cx-r,cy+r*0.4,r*1.4,r*0.6);}
    else if(it.type==='gift'){ctx.fillStyle='#ff44aa';ctx.fillRect(cx-r,cy-r*0.8,r*2,r*1.6);ctx.fillStyle='#ffaadd';ctx.fillRect(cx-r*0.2,cy-r*1.4,r*0.4,r*2);ctx.fillRect(cx-r,cy-r*0.8,r*2,r*0.4);ctx.beginPath();ctx.arc(cx-r*0.6,cy-r,r*0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+r*0.6,cy-r,r*0.5,0,Math.PI*2);ctx.fill();}
    else if(it.type==='trap'){ctx.fillStyle='#ffdd00';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.font=Math.max(8,r*1.2)+'px serif';ctx.fillText('*',cx,cy+1);}
    else if(it.type==='halve'){ctx.fillStyle='#ff44ff';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold '+Math.max(6,Math.floor(r*0.9))+'px monospace';ctx.fillText('1/2',cx,cy+0.5);}
    ctx.restore();
  }
  // holes
  for(let h of holes){if(!h.active)continue;let x=h.c*CELL+CELL/2,y=h.r*CELL+CELL/2,r=Math.max(4,CELL*0.3);ctx.save();ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(x,y,r,r*0.7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#6633cc';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#cc88ff';ctx.font=Math.max(6,Math.floor(r))+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('*',x,y);ctx.restore();}
  // falling diamonds
  let tnow=Date.now();
  for(let fd of fDiamonds){
    if(fd.delay>0)continue;
    let t=fd.progress,x=fd.tx,y=fd.y+(fd.ty-fd.y)*t,ds=Math.max(4,CELL*0.25);
    ctx.save();
    ctx.globalAlpha=0.25;ctx.strokeStyle='#aaffff';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(x,Math.max(0,fd.y));ctx.lineTo(x,y);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle='#00eeff';ctx.beginPath();ctx.moveTo(x,y-ds);ctx.lineTo(x+ds*0.8,y);ctx.lineTo(x,y+ds);ctx.lineTo(x-ds*0.8,y);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#aaffff';ctx.lineWidth=0.5;ctx.stroke();ctx.restore();
  }
  // landed diamonds
  for(let d of diamonds){if(!d.active)continue;let x=d.c*CELL+CELL/2,y=d.r*CELL+CELL/2,ds=Math.max(4,CELL*0.28);ctx.save();ctx.fillStyle='#00eeff';ctx.beginPath();ctx.moveTo(x,y-ds);ctx.lineTo(x+ds*0.83,y);ctx.lineTo(x,y+ds);ctx.lineTo(x-ds*0.83,y);ctx.closePath();ctx.fill();ctx.fillStyle='#aaffff';ctx.beginPath();ctx.moveTo(x,y-ds);ctx.lineTo(x+ds*0.83,y);ctx.lineTo(x,y-ds*0.17);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=0.5;ctx.stroke();ctx.restore();}
  // bombs
  for(let b of mazeBombs){let x=b.c*CELL+CELL/2,y=b.r*CELL+CELL/2,pct=b.fuseTimer/3000,br=Math.max(4,CELL*0.32);ctx.save();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,br,0,Math.PI*2);ctx.fill();ctx.strokeStyle=pct<0.3?'#ff0000':'#777';ctx.lineWidth=1.2;ctx.stroke();ctx.strokeStyle='#8B4513';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+br*0.4,y-br*0.85);ctx.quadraticCurveTo(x+br*1.3,y-br*1.85,x+br*0.7,y-br*1.3);ctx.stroke();if(pct<0.5||Math.floor(tnow/120)%2===0){ctx.fillStyle=pct<0.3?'#ff0000':'#ffcc00';ctx.beginPath();ctx.arc(x+br*0.7,y-br*1.3,pct<0.3?4:2.5,0,Math.PI*2);ctx.fill();}ctx.restore();}
  // explosions
  for(let ex of mazeExplosions){let alpha=Math.min(1,ex.life/200);ctx.save();ctx.globalAlpha=alpha;for(let cell of ex.cells){let cx2=cell.c*CELL,cy2=cell.r*CELL;let g=ctx.createRadialGradient(cx2+CELL/2,cy2+CELL/2,1,cx2+CELL/2,cy2+CELL/2,CELL/2);g.addColorStop(0,'#ffffff');g.addColorStop(0.4,'#ffaa00');g.addColorStop(1,'rgba(255,50,0,0)');ctx.fillStyle=g;ctx.fillRect(cx2,cy2,CELL,CELL);}ctx.restore();}
  // bosses
  for(let b of mazeBosses){let x=b.x,y=b.y,wobble=b.frame===0?-2:2,bs=Math.max(6,CELL*0.38);ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,bs*1.1,bs*0.9,bs*0.38,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(0,-bs*0.25,bs,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-bs*.38,-bs*.38,bs*.31,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bs*.38,-bs*.38,bs*.31,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-bs*.31,-bs*.38,bs*.16,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bs*.44,-bs*.38,bs*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.color;ctx.fillRect(-bs*0.75,bs*.63,bs*0.5,bs*0.75+wobble);ctx.fillRect(bs*.25,bs*.63,bs*0.5,bs*0.75-wobble);ctx.strokeStyle='#ccc';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bs*.88,-bs*.25);ctx.lineTo(bs*1.75+wobble*2,-bs*.63);ctx.stroke();ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(bs*1.75+wobble*2,-bs*.63);ctx.lineTo(bs*2.25+wobble*2,-bs);ctx.lineTo(bs*2+wobble*2,-bs*.38);ctx.closePath();ctx.fill();ctx.restore();}
  // tanks
  for(let tk of tanks){let{x,y,angle}=tankXY(tk),ts=CELL;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.fillStyle='#556633';ctx.fillRect(-ts*0.5,-ts*0.32,ts,ts*0.64);ctx.fillStyle='#445522';ctx.beginPath();ctx.arc(0,0,ts*0.27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#334411';ctx.fillRect(0,-ts*0.09,ts*0.55,ts*0.18);ctx.fillStyle='#2a3310';ctx.fillRect(-ts*0.5,-ts*0.36,ts,ts*0.14);ctx.fillRect(-ts*0.5,ts*0.23,ts,ts*0.14);ctx.fillStyle='#1a2008';[-ts*0.32,0,ts*0.32].forEach(ox=>{ctx.beginPath();ctx.arc(ox,-ts*0.3,ts*0.09,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ox,ts*0.3,ts*0.09,0,Math.PI*2);ctx.fill();});ctx.restore();ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.arc(0,-ts*0.73,ts*0.41,0,Math.PI*2);ctx.fill();ctx.fillStyle=tk.dc===1?'#ff4444':'#ffcc00';ctx.font='bold '+Math.max(8,Math.floor(ts*0.45))+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tk.dc,0,-ts*0.73);ctx.restore();}
  // player
  if(playerDead&&Math.floor(tnow/100)%2===0)return;
  {let x=player.x,y=player.y,fr=player.frame,lo=[0,2,0,-2][fr],ps=Math.max(8,CELL*0.45);ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,ps*0.9,ps*0.7,ps*0.3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2244cc';ctx.fillRect(-ps*0.45,ps*0.4,ps*0.36,ps*0.5+lo);ctx.fillRect(ps*0.09,ps*0.4,ps*0.36,ps*0.5-lo);ctx.fillStyle='#fff';ctx.fillRect(-ps*0.55,-ps*0.36,ps*1.1,ps*0.9);ctx.fillStyle='#ddd';ctx.fillRect(-ps*0.55,-ps*0.36,ps*0.27,ps*0.9);ctx.fillStyle='#333';ctx.fillRect(-ps*0.55,ps*0.27,ps*1.1,ps*0.18);ctx.fillStyle='#2244cc';ctx.beginPath();ctx.ellipse(0,-ps*0.55,ps*0.64,ps*0.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4466ff';ctx.beginPath();ctx.ellipse(-ps*0.18,-ps*0.73,ps*0.27,ps*0.18,0.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#88aaff';ctx.fillRect(-ps*0.36,-ps*0.64,ps*0.73,ps*0.36);ctx.fillStyle='#ffcc00';ctx.fillRect(-ps*0.27,-ps*0.55,ps*0.18,ps*0.18);ctx.fillRect(ps*0.09,-ps*0.55,ps*0.18,ps*0.18);ctx.fillStyle='#ffaaaa';ctx.beginPath();ctx.arc(-ps*0.64,0,ps*0.27,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ps*0.64,0,ps*0.27,0,Math.PI*2);ctx.fill();if(playerStunTimer>0){let ns=3;for(let s=0;s<ns;s++){let a=stunAnimAngle+s*(Math.PI*2/ns);let sx=Math.cos(a)*ps*0.9,sy=-ps*1.4+Math.sin(a)*ps*0.36;ctx.font=Math.max(7,Math.floor(ps*0.36))+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('*',sx,sy);}}ctx.restore();}
}

function init(){
  canvas=document.getElementById('cv');
  bCv=document.getElementById('bCv');
  computeSizes();
  ctx=canvas.getContext('2d');
  bCtx=bCv.getContext('2d');
  initTanks();genMaze();buildDots();placeItems();
  diamonds=[];fDiamonds=[];mazeBombs=[];mazeExplosions=[];
  initPlayer();spawnMazeBosses();
  gameState='idle';activeBetAmt=betAmt;totalWin=0;collected=[];
  updateBalanceUI();document.getElementById('hudWin').textContent='0.00';
  document.getElementById('hudTime').textContent='5.0s';document.getElementById('timerFill').style.width='100%';
  document.getElementById('btnSpin').disabled=false;setBetControls(false);
  if(mainAnim)cancelAnimationFrame(mainAnim);lastMainTs=0;
  mainAnim=requestAnimationFrame(mainLoop);
}

document.getElementById('btnSpin').addEventListener('click',startSpin);
document.getElementById('btnBetM').addEventListener('click',()=>{if(gameState!=='idle')return;betIdx=Math.max(0,betIdx-1);betAmt=BET_OPTS[betIdx];activeBetAmt=betAmt;document.getElementById('betDisp').textContent=betAmt.toFixed(2);document.getElementById('hudBet').textContent=betAmt.toFixed(2);});
document.getElementById('btnBetP').addEventListener('click',()=>{if(gameState!=='idle')return;betIdx=Math.min(BET_OPTS.length-1,betIdx+1);betAmt=BET_OPTS[betIdx];activeBetAmt=betAmt;document.getElementById('betDisp').textContent=betAmt.toFixed(2);document.getElementById('hudBet').textContent=betAmt.toFixed(2);});

window.addEventListener('resize',()=>{
  computeSizes();
  // reposition bosses/player to new cell coords
  for(let b of mazeBosses){b.x=b.c*CELL+CELL/2;b.y=b.r*CELL+CELL/2;}
  player.x=player.c*CELL+CELL/2;player.y=player.r*CELL+CELL/2;
});
window.addEventListener('load',init);
</script></body></html>
